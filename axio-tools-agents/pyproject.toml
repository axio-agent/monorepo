[project]
name = "axio-tools-agents"
version = "0.1.0"
description = "Agent-to-agent messaging tools for Axio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["axio"]

[project.entry-points."axio.tools"]
list_peers = "axio_tools_agents.peers:list_peers"
send_message = "axio_tools_agents.peers:send_message"
spawn_agent = "axio_tools_agents.peers:spawn_agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axio_tools_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "README.md"]

[tool.ruff]
line-length = 119
output-format = "concise"
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.14",
    "ruff>=0.9",
    "pytest-cov>=7.1.0",
    "markdown-pytest>=0.6.0",
]
